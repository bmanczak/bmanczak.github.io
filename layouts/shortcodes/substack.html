{{- $url := .Get "url" -}} {{- $title := .Get "title" | default "Read on
Substack" -}} {{- $description := .Get "description" | default "" -}}
<a href="{{ $url }}" target="_blank" rel="noopener" class="substack-card">
  <div class="substack-card-icon">
    <svg
      viewBox="0 0 24 24"
      width="28"
      height="28"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24l9.56-5.26L20.58 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"
      />
    </svg>
  </div>
  <div class="substack-card-body">
    <span class="substack-card-label">Substack</span>
    <span class="substack-card-title">{{ $title }}</span>
    {{- if $description }}
    <span class="substack-card-desc">{{ $description }}</span>
    {{- end }}
  </div>
  <div class="substack-card-arrow">
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7 17L17 7M17 7H7M17 7V17" />
    </svg>
  </div>
</a>
